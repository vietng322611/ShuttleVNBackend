---
- name: Prepare public server
  hosts: public
  become: true

  tasks:
    # frontend is created by the deploy task below with its own ownership,
    # so it is not part of this loop; listing it here would make the two
    # tasks overwrite each other's group on every run.
    - name: Create public service directories
      ansible.builtin.file:
        path: "/opt/shuttlevn/{{ item }}"
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'
      loop:
        - proxy
        - monitoring
    
    - name: Install frontend Compose file
      ansible.builtin.template:
        src: ../templates/frontend.compose.yml.j2
        dest: /opt/shuttlevn/frontend/compose.yml
        owner: root
        group: root
        mode: "0644"

    # The GitHub runner user deploys here and writes .env and deploy.log,
    # so the directory has to be group-writable for the docker group.
    - name: Allow the docker group to deploy
      ansible.builtin.file:
        path: /opt/shuttlevn/frontend
        state: directory
        owner: ubuntu
        group: docker
        mode: '0775'

    - name: Install Nginx
      ansible.builtin.apt:
        name: nginx
        state: present

    # Nginx refuses to reload with a missing certificate, so the files have to
    # exist before the site config that references them is installed.
    - name: Create the TLS directory
      ansible.builtin.file:
        path: /etc/nginx/ssl
        state: directory
        owner: root
        group: root
        mode: '0700'

    - name: Install the origin TLS certificate
      ansible.builtin.copy:
        src: "{{ shuttlevn_tls_source }}/fullchain.pem"
        dest: /etc/nginx/ssl/fullchain.pem
        owner: root
        group: root
        mode: '0644'
      notify: Reload Nginx

    - name: Install the origin TLS private key
      ansible.builtin.copy:
        src: "{{ shuttlevn_tls_source }}/privkey.pem"
        dest: /etc/nginx/ssl/privkey.pem
        owner: root
        group: root
        mode: '0600'
      notify: Reload Nginx

    - name: Install ShuttleVN Nginx config
      ansible.builtin.template:
        src: ../templates/shuttlevn.nginx.conf.j2
        dest: /etc/nginx/sites-available/shuttlevn
        owner: root
        group: root
        mode: "0644"
      notify: Reload Nginx

    - name: Disable default Nginx site
      ansible.builtin.file:
        path: /etc/nginx/sites-enabled/default
        state: absent
      notify: Reload Nginx

    - name: Enable ShuttleVN Nginx site
      ansible.builtin.file:
        src: /etc/nginx/sites-available/shuttlevn
        dest: /etc/nginx/sites-enabled/shuttlevn
        state: link
      notify: Reload Nginx

    - name: Check Nginx config
      ansible.builtin.command: nginx -t
      changed_when: false

    - name: Enable and start Nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started
  
  handlers:
    - name: Reload Nginx
      ansible.builtin.service:
        name: nginx
        state: reloaded