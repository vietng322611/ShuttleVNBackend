---
- name: Prepare private monitoring
  hosts: private
  become: true

  tasks:
    - name: Create monitoring directory
      ansible.builtin.file:
        path: /opt/shuttlevn/monitoring
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Require secrets from group_vars/all/secrets.yml
      ansible.builtin.assert:
        that:
          - grafana_admin_password | length > 0
          - alert_webhook_url | length > 0
        fail_msg: >-
          Fill grafana_admin_password and alert_webhook_url in
          infrastructure/ansible/group_vars/all/secrets.yml
          (copy secrets.yml.example, or run: ansible-vault encrypt group_vars/all/secrets.yml).

    # Grafana image runs as uid 472, so secrets must be owned by it.
    - name: Create Grafana admin password file
      ansible.builtin.copy:
        dest: /opt/shuttlevn/monitoring/grafana_admin_password
        content: "{{ grafana_admin_password }}\n"
        owner: '472'
        group: '472'
        mode: '0600'
      no_log: true

    - name: Install Prometheus configuration
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/prometheus.yml.j2"
        dest: /opt/shuttlevn/monitoring/prometheus.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        notify: Restart Prometheus

    - name: Install Grafana datasource
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../templates/grafana-datasource.yml"
        dest: /opt/shuttlevn/monitoring/grafana-datasource.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        notify: Restart Grafana

    - name: Install Grafana dashboard provider
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../templates/grafana-dashboards.yml"
        dest: /opt/shuttlevn/monitoring/grafana-dashboards.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        notify: Restart Grafana

    - name: Create Grafana dashboards directory
      ansible.builtin.file:
        path: /opt/shuttlevn/monitoring/dashboards
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Install Grafana dashboards
      ansible.builtin.copy:
        src: "{{ playbook_dir }}/../templates/dashboards/"
        dest: /opt/shuttlevn/monitoring/dashboards/
        owner: ubuntu
        group: ubuntu
        mode: '0644'
        directory_mode: '0755'
        notify: Restart Grafana

    - name: Install Grafana alert rules
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/grafana-alerting.yml"
        dest: /opt/shuttlevn/monitoring/grafana-alerting.yml
        owner: '472'
        group: '472'
        mode: '0600'
        no_log: true
        notify: Restart Grafana

    - name: Install observability Compose file
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/observability.compose.yml.j2"
        dest: /opt/shuttlevn/monitoring/observability.yml
        owner: ubuntu
        group: ubuntu
        mode: '0644'

    - name: Start Prometheus and Grafana
      community.docker.docker_compose_v2:
        project_src: /opt/shuttlevn/monitoring
        files:
          - observability.yml
        project_name: observability
        state: present

  handlers:
    - name: Restart Prometheus
      community.docker.docker_compose_v2:
        project_src: /opt/shuttlevn/monitoring
        files:
          - observability.yml
        project_name: observability
        services:
          - prometheus
        state: restarted

    - name: Restart Grafana
      community.docker.docker_compose_v2:
        project_src: /opt/shuttlevn/monitoring
        files:
          - observability.yml
        project_name: observability
        services:
          - grafana
        state: restarted